<html>
    <head>
        <title>Textures</title>
        <link href="base.css" rel="stylesheet" />
    </head>

    <body>
        <div class="content">
            <div class="settings">
                <p>Arrows: rotate, Q/E: move, Shift + Q/E: scale, -/+: light intensivity, Shift + -/+: quad, 0/9: linear</p>
                <p>A/D: ambient, Shift + A/D: diffusal, Z/C: specular, `: next tint (R/G/B 70%), B/Shift+B: bump/normal scale </p>
            </div>

            <div class="canvas">
                <canvas id="canvas" width="1200", height="800"></canvas>
            </div>
        </div>

        <div class="textures-container">
            <img id="texture1" src="./dist/texture1.png">
            <img id="texture2" src="./dist/texture2.png">
            <img id="texture3" src="./dist/texture3.png">
            <img id="pigeon" src="./dist/pigeon.png">
            <img id="wood" src="./dist/wood.jpg">
            <img id="orange" src="./dist/orange-peel-texture-6-1024x723-4207643686.79814e79.jpg">
            <!-- <img id="orange" src="./dist/food_0022_color_1k.jpg"> -->
            <img id="orange-heightmap" src="./dist/food_0022_roughness_1k.jpg">
            <img id="rock" src="./dist/rock.png">
            <img id="rock-normalmap" src="./dist/rock_normal.png">

        </div>

        <script src="src/index.ts" type="module"></script>
    </body>
</html>
