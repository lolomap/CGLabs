<html>
    <head>
        <title>Light</title>
        <link href="base.css" rel="stylesheet" />
    </head>

    <body>
        <div class="content">
            <div class="settings">
                <p>Arrows: rotate, Q/E: move, Shift + Q/E: scale, -/+: light intensivity, Shift + -/+: quad, 0/9: linear</p>
                <p>A/D: ambient, Shift + A/D: diffusal, Z/C: specular</p>
                <p>G - Gouraud/Phong shading, L - Lambert/Phong light model</p>
            </div>

            <div class="canvas">
                <canvas id="canvas" width="1200", height="800"></canvas>
            </div>
        </div>

        <script src="src/index.ts" type="module"></script>
    </body>
</html>
